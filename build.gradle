import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'com.gradleup.shadow' version '9.6.1'
}

subprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"
    apply plugin: "com.gradleup.shadow"



    ext {
        tbVersion = "1.1." + ('git rev-list --count HEAD'.execute().text.trim())

        snakeYamlVersion = "1.29"
        websocketVersion = "1.6.0"
        husbyVersion = "9298199ab9"
        lombokVersion = "1.18.48"
        guavaVersion = "33.7.1-jre"
        gsonVersion = "2.14.0"
        commonsVersion = "2.22.0"
        jlineVersion = "3.20.0"
        logbackVersion = "1.3.0-alpha10"
        jdaVersion = "5.0.0-beta.12"
        hikariVersion = "4.0.3"
        apacheHttpVersion = "4.5.14"
        jspecifyVersion = "1.0.1"
    }

    group "net.buildtheearth.terrabungee"
    version "$tbVersion"

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }

    repositories {
        mavenCentral()
        maven {
            name = "JitPack"
            url = "https://jitpack.io/"
        }
        maven {
            name = 'papermc-repo'
            url = 'https://repo.papermc.io/repository/maven-public/'
        }
        maven {
            name = 'codemc-snapshots'
            url = 'https://repo.codemc.io/repository/maven-snapshots'
        }
        //jcenter() 🦀 jcenter is gone 🦀
    }

    dependencies {
        if (!("common".equalsIgnoreCase(project.name))) {
            implementation project(":common")
        }

        compileOnly "org.projectlombok:lombok:$lombokVersion"
        testCompileOnly "org.projectlombok:lombok:$lombokVersion"
        annotationProcessor "org.projectlombok:lombok:$lombokVersion"
        testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
    }

    publishing {
        publications {
            maven(MavenPublication) {
                groupId = "net.buildtheearth.terrabungee"
                artifactId = project.name
                version = project.version

                from components.java
            }
        }

        repositories {
            maven {
                name "buildtheearth"
                url "https://maven.buildtheearth.net/private"

                credentials {
                    username = "$System.env.JB_SPACE_CLIENT_ID"
                    password = "$System.env.JB_SPACE_CLIENT_SECRET"
                }
            }
        }
    }

    tasks.named('shadowJar', ShadowJar) {
        archiveFileName.set("TerraBungee-${project.name}-${tbVersion}.jar")

        // Automatically relocate everything except SLF4J
        if (project.name.equals("proxy-velocity")) {
            dependencies {
                exclude(dependency('org.slf4j:.*'))
            }
        }

        // Manually relocate all other dependencies
        relocate('com.example', 'net.buildtheearth.com.example')
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    jar.finalizedBy shadowJar
}
